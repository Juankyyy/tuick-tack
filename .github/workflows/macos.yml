# macOS build and packaging, kept for occasional manual releases. The port is
# frozen: this workflow has no push trigger, so dev produces no macOS artifacts
# and a Windows release never builds macOS. Dispatch it by hand when a macOS
# build is explicitly requested; a manual run can stamp a version and attach the
# universal zip to an existing GitHub release. The package job combines both
# architectures with lipo, builds Tuick-Tack.app from macos/, signs it ad-hoc
# and writes the universal zip, its .sha256 and SHA256SUMS.txt. The release
# upload never creates a release.
name: macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp when no tag is given (vX.Y.Z); empty or dev keeps 0.0.0 in Info.plist
        required: false
        default: ""
      tag:
        description: Existing release tag to attach the app to (optional); also stamps the version
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Tag dispatches get their own group, so one manual run cannot cancel a
  # release attach (and vice versa).
  group: macos-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  # A release dispatch stamps the tag, so the app inside the zip always
  # matches the release it is attached to.
  VERSION: ${{ github.event.inputs.tag || github.event.inputs.version || 'dev' }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          # A release dispatch must build the tagged commit, not the branch the
          # manual run was started from.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: check the release tag
        if: github.event.inputs.tag != ''
        env:
          TAG: ${{ github.event.inputs.tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName >/dev/null
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: go build (no cgo)
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: build ${{ matrix.arch }} binary
        run: bash scripts/build-macos.sh build -version "$VERSION" -arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: tuick-tack-darwin-${{ matrix.arch }}
          path: dist/tuick-tack-darwin-${{ matrix.arch }}
          if-no-files-found: error

  package:
    name: Package universal app
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: tuick-tack-darwin-*
          path: dist
          merge-multiple: true
      - name: package Tuick-Tack.app
        run: |
          bash scripts/build-macos.sh package -version "$VERSION" \
            -arm64 dist/tuick-tack-darwin-arm64 \
            -amd64 dist/tuick-tack-darwin-amd64
      - name: verify the artifact
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          (cd dist && shasum -a 256 -c tuick-tack-macos-universal.zip.sha256)
          plutil -lint dist/Tuick-Tack.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/Tuick-Tack.app
          lipo dist/Tuick-Tack.app/Contents/MacOS/tuick-tack -verify_arch arm64 x86_64
          unzip -Z1 dist/tuick-tack-macos-universal.zip
          unzip -Z1 dist/tuick-tack-macos-universal.zip | grep -qx 'README.txt'
          unzip -Z1 dist/tuick-tack-macos-universal.zip | grep -qx 'Tuick-Tack.app/Contents/Info.plist'
          unzip -Z1 dist/tuick-tack-macos-universal.zip | grep -qx 'Tuick-Tack.app/Contents/MacOS/launcher'
          unzip -Z1 dist/tuick-tack-macos-universal.zip | grep -qx 'Tuick-Tack.app/Contents/MacOS/tuick-tack'
          rm -rf dist/unzipped
          ditto -x -k dist/tuick-tack-macos-universal.zip dist/unzipped
          codesign --verify --deep --strict --verbose=2 dist/unzipped/Tuick-Tack.app
          lipo dist/unzipped/Tuick-Tack.app/Contents/MacOS/tuick-tack -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: tuick-tack-macos-universal
          path: |
            dist/tuick-tack-macos-universal.zip
            dist/tuick-tack-macos-universal.zip.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Attach the app to the release
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag }}
      # Without a checkout there is no git remote; tell gh which repository.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: check the tag
        run: |
          case "$TAG" in
          v[0-9]*) ;;
          *)
            echo "tag must look like vX.Y.Z (got: $TAG)" >&2
            exit 2
            ;;
          esac
      - uses: actions/download-artifact@v8
        with:
          name: tuick-tack-macos-universal
          path: dist
      - name: verify the artifact
        working-directory: dist
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          shasum -a 256 -c tuick-tack-macos-universal.zip.sha256
      - name: attach the app to the release
        run: |
          gh release upload "$TAG" \
            dist/tuick-tack-macos-universal.zip \
            dist/tuick-tack-macos-universal.zip.sha256 \
            --clobber
