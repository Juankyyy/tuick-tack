# Base of the macOS workflow. Phase 1 runs the full vet, tests and build without
# cgo on both architectures. The real menu bar needs cgo; the packaging phase
# grows this file into the cgo build, lipo, the .app bundle, the ad-hoc signature
# and the universal zip for the release.
name: macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-cgo:
    name: macOS ${{ matrix.arch }} (no cgo)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: go build
        run: go build ./...
