# Windows is the only supported platform and runs vet, tests and a full build
# with CGO_ENABLED=0 on every push and pull request. The macOS job is kept for
# the frozen port and only runs on manual dispatch; when it runs it also builds
# with CGO_ENABLED=1, which compiles the real menu bar through systray.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: go build
        run: go build ./...

  # Frozen port: manual dispatch only. Do not move it back to push or pull_request.
  darwin:
    name: macOS ${{ matrix.arch }} (no cgo)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: go build
        run: go build ./...
      - name: go build (cgo tray)
        env:
          CGO_ENABLED: "1"
        run: go build ./...
